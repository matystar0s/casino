<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#091510">
    <title>Automaty | Online Kasino</title>
    <link rel="stylesheet" href="automaty.css">
    <link rel="stylesheet" href="casino.css">
</head>
<body>
    <header class="site-header">
        <h1>Automaty</h1>
        <div id="casinoAccount" class="account-panel"></div>
    </header>
    <main>
        <p>Vítejte ve hře Automaty! Roztočte válce a zkuste své štěstí.</p>
        <div class="game-options">
            <label class="field" for="betAmount">
                <span>Sázka v kreditech</span>
                <input id="betAmount" type="number" min="1" step="1" value="25" inputmode="numeric">
            </label>
        </div>
        <section class="slot-machine" aria-label="Automat se třemi válci">
            <div class="machine-top" aria-hidden="true">★ ŠŤASTNÁ SEDMIČKA ★</div>
            <div class="reels">
                <div class="reel" aria-label="První válec"><span class="reel-symbol">🍒</span></div>
                <div class="reel" aria-label="Druhý válec"><span class="reel-symbol">🍋</span></div>
                <div class="reel" aria-label="Třetí válec"><span class="reel-symbol">⭐</span></div>
            </div>
            <div class="machine-lights" aria-hidden="true">●　●　●　●　●</div>
        </section>
        <div class="slot-controls">
            <button id="spinButton" type="button" onclick="spinSlots()">Roztočit válce</button>
            <button id="stopButton" type="button" onclick="stopSlot()" disabled>Zastavit válec</button>
        </div>
        <div id="result" aria-live="polite">Roztočte válce a zastavte je postupně.</div>
        <p class="responsible-note">Tři stejné symboly vrací 10× sázku, trojice sedmiček 25× a dvojice 2×. Hrajete pouze o testovací kredity.</p>
    </main>
    <footer>
        <a href="index.html">Zpět na hlavní stránku</a>
    </footer>
    <script src="casino.js"></script>
    <script src="automaty.js"></script>
</body>
</html>
