<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#091510">
    <title>Hod mincí | Online Kasino</title>
    <link rel="stylesheet" href="hry.css">
    <link rel="stylesheet" href="casino.css">
</head>
<body>
    <header class="site-header">
        <h1>Hod mincí</h1>
        <div id="casinoAccount" class="account-panel"></div>
    </header>
    <main class="game-page">
        <p class="game-intro">Tipněte si, která strana mince padne, a roztočte ji.</p>
        <section class="mini-game-board" aria-label="Animovaný hod mincí">
            <div id="coin" class="coin" aria-live="polite">Mince</div>
        </section>
        <div class="game-options">
            <label class="field" for="betAmount">
                <span>Sázka v kreditech</span>
                <input id="betAmount" type="number" min="1" step="1" value="25" inputmode="numeric">
            </label>
            <label class="field" for="prediction">
                <span>Váš tip</span>
                <select id="prediction">
                    <option value="orel">Orel</option>
                    <option value="panna">Panna</option>
                </select>
            </label>
        </div>
        <div class="mini-game-controls">
            <button id="flipButton" type="button" onclick="flipCoin()">Hodit mincí</button>
        </div>
        <div id="result" class="game-result" aria-live="polite">Tipněte si a hoďte mincí.</div>
        <p class="responsible-note">Výherní tip vrací 2× sázku. Hrajete pouze o testovací kredity, ne o skutečné peníze.</p>
    </main>
    <footer><a href="index.html">Zpět na hlavní stránku</a></footer>
    <script src="casino.js"></script>
    <script src="mince.js"></script>
</body>
</html>
