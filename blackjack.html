<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#091510">
    <title>Blackjack | Online Kasino</title>
    <link rel="stylesheet" href="blackjack.css">
    <link rel="stylesheet" href="casino.css">
</head>
<body>
    <header class="site-header">
        <h1>Blackjack</h1>
        <div id="casinoAccount" class="account-panel"></div>
    </header>
    <main class="game-page">
        <p class="game-intro">Klasický blackjack proti dealerovi. Přibližte se k 21, ale nepřekročte ji.</p>
        <section class="blackjack-table" aria-label="Herní stůl blackjacku">
            <div class="hand-zone">
                <div class="hand-heading">
                    <h2>Dealer</h2>
                    <span id="dealerScore">Součet: —</span>
                </div>
                <div id="dealerCards" class="hand-cards" aria-label="Karty dealera"></div>
            </div>
            <div class="table-divider"><span>♠</span><span>♥</span><span>♦</span><span>♣</span></div>
            <div class="hand-zone">
                <div class="hand-heading">
                    <h2>Vaše karty</h2>
                    <span id="playerScore">Součet: —</span>
                </div>
                <div id="playerCards" class="hand-cards" aria-label="Vaše karty"></div>
            </div>
        </section>
        <div class="game-options">
            <label class="field" for="betAmount">
                <span>Sázka v kreditech</span>
                <input id="betAmount" type="number" min="1" step="1" value="50" inputmode="numeric">
            </label>
        </div>
        <div class="buttons blackjack-buttons">
            <button id="dealButton" type="button" onclick="startNewGame()">Rozdat karty</button>
            <button id="drawCardBtn" type="button" class="button-secondary" onclick="drawCard()" disabled>Líznout kartu</button>
            <button id="endGameBtn" type="button" class="button-secondary" onclick="endGame()" disabled>Zastavit a vyhodnotit</button>
        </div>
        <div id="result" class="game-result" aria-live="polite">Vytvořte demo účet a rozdejte karty.</div>
        <p class="responsible-note">Pravidla dema: eso má hodnotu 1 nebo 11, obrázkové karty 10. Dealer dobírá do 17. Blackjack vyplácí 3:2.</p>
    </main>
    <footer>
        <a href="index.html">Zpět na hlavní stránku</a>
    </footer>
    <script src="casino.js"></script>
    <script src="blackjack.js"></script>
</body>
</html>
