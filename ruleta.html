<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#091510">
    <title>Ruleta | Online Kasino</title>
    <link rel="stylesheet" href="ruleta.css">
    <link rel="stylesheet" href="casino.css">
</head>
<body>
    <header class="site-header">
        <h1>Ruleta</h1>
        <div id="casinoAccount" class="account-panel"></div>
    </header>
    <main>
        <p>Vítejte ve hře Ruleta! Roztočte kolo a zkuste své štěstí.</p>
        <div class="game-options">
            <label class="field" for="betAmount">
                <span>Sázka v kreditech</span>
                <input id="betAmount" type="number" min="1" step="1" value="25" inputmode="numeric">
            </label>
            <label class="field" for="betColor">
                <span>Tip na barvu</span>
                <select id="betColor">
                    <option value="red">Červená</option>
                    <option value="black">Černá</option>
                    <option value="green">Zelená (0)</option>
                </select>
            </label>
        </div>
        <section class="roulette" aria-label="Ruletové kolo">
            <div class="roulette-pointer" aria-hidden="true"></div>
            <div id="wheel" class="wheel">
                <div id="wheelNumbers" class="wheel-numbers" aria-hidden="true"></div>
                <div class="wheel-center" aria-hidden="true"><span>0</span></div>
            </div>
            <div id="ballTrack" class="ball-track" aria-hidden="true">
                <span class="ball"></span>
            </div>
        </section>
        <button id="spinButton" type="button" onclick="spinWheel()">Vsadit a roztočit</button>
        <div id="result" aria-live="polite">Vyberte si štěstí a roztočte kolo.</div>
        <p class="responsible-note">Výhra za červenou nebo černou vrací 2× sázku. Zelená nula vrací 36×. Hraje se jen o testovací kredity.</p>
    </main>
    <footer>
        <a href="index.html">Zpět na hlavní stránku</a>
    </footer>
    <script src="firebase-config.js"></script>
    <script type="module" src="casino.js"></script>
    <script src="ruleta.js"></script>
</body>
</html>
