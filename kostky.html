<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#091510">
    <title>Kostky | Online Kasino</title>
    <link rel="stylesheet" href="hry.css">
    <link rel="stylesheet" href="casino.css">
</head>
<body>
    <header class="site-header">
        <h1>Kostky</h1>
        <div id="casinoAccount" class="account-panel"></div>
    </header>
    <main class="game-page">
        <p class="game-intro">Vsaďte na součet dvou kostek a sledujte jejich hod.</p>
        <section class="mini-game-board" aria-label="Hod dvěma kostkami">
            <div class="dice-pair">
                <div id="dieOne" class="die" aria-label="První kostka">⚀</div>
                <div id="dieTwo" class="die" aria-label="Druhá kostka">⚅</div>
            </div>
        </section>
        <div class="game-options">
            <label class="field" for="betAmount">
                <span>Sázka v kreditech</span>
                <input id="betAmount" type="number" min="1" step="1" value="25" inputmode="numeric">
            </label>
            <label class="field" for="prediction">
                <span>Váš tip</span>
                <select id="prediction">
                    <option value="high">Víc než 7 (výplata 2×)</option>
                    <option value="low">Míň než 7 (výplata 2×)</option>
                    <option value="seven">Přesně 7 (výplata 5×)</option>
                </select>
            </label>
        </div>
        <div class="mini-game-controls">
            <button id="rollButton" type="button" onclick="rollDice()">Hodit kostkami</button>
        </div>
        <div id="result" class="game-result" aria-live="polite">Tipněte si a hoďte kostkami.</div>
        <p class="responsible-note">Hrajete pouze o testovací kredity. Nikdy nejde o skutečné peníze.</p>
    </main>
    <footer><a href="index.html">Zpět na hlavní stránku</a></footer>
    <script src="casino.js"></script>
    <script src="kostky.js"></script>
</body>
</html>
